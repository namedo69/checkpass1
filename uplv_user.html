<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UpLv của tôi · SP1S</title>
<style>
:root{font:14px/1.5 Inter,system-ui,sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e2e8f0;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header b{color:#ea580c;font-size:20px}a{color:#2563eb}main{padding:26px;max-width:1500px;margin:auto}.layout{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}.card{background:white;padding:22px;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:18px;box-shadow:0 4px 16px #0f172a06}h1,h2{margin:0 0 10px}h2{font-size:18px}.muted{color:#64748b}input,select,textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white}textarea{width:100%;min-height:240px;margin:12px 0;resize:vertical}button{cursor:pointer;color:#334155}button:disabled{opacity:.5;cursor:wait}.primary{background:linear-gradient(120deg,#e53935,#ea580c);color:white;border:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.stats b{font-size:21px}.progress{height:7px;background:#e2e8f0;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#059669}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0}th{background:#f8fafc;color:#64748b;font-size:12px}.scroll{overflow:auto}#error{color:#b91c1c;white-space:pre-wrap}.badge{background:#eff6ff;color:#2563eb;padding:4px 8px;border-radius:8px}.job{border:1px solid #e2e8f0;padding:17px;border-radius:10px;margin:12px 0}dialog{border:0;border-radius:14px;width:min(1250px,95vw);max-height:90vh;padding:24px}dialog::backdrop{background:#0f172a88}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:14px}}
</style></head><body><header><b>SP1S · UpLv</b><div><span id="user"></span> · <a href="/">Về hệ thống</a></div></header>
<main><h1>Nâng cấp tài khoản</h1><p class="muted">Theo dõi các đơn và kết quả nâng cấp của riêng bạn.</p><p id="error" role="alert"></p><div class="layout"><section class="card"><h2>Tạo đơn UpLv</h2><p id="limits" class="muted">Đang tải hạn mức…</p><label>Cấp mục tiêu <input id="target" type="number" min="6" max="30" value="12" style="width:85px"></label><p><label>Chế độ <select id="mode"><option value="victory">WIN</option><option value="defeat">LOST</option><option value="surrender">Đầu hàng</option></select></label></p><label for="input">Tài khoản — mỗi dòng user|pass</label><textarea id="input" placeholder="user|pass"></textarea><button id="create" class="primary" onclick="createJob()">Bắt đầu nâng cấp</button></section><section class="card"><div class="toolbar"><h2>Đơn của tôi</h2><button onclick="refresh()">Làm mới</button><span id="updated" class="muted"></span></div><div id="jobs">Đang tải…</div></section></div></main>
<dialog id="details"><div class="toolbar"><h2>Tài khoản của đơn <span id="jobLabel"></span></h2><button onclick="$('details').close()">Đóng</button></div><div class="toolbar"><input id="search" placeholder="Tìm tên tài khoản" oninput="searchAccounts()"><select id="status" onchange="page=1;loadAccounts()"><option value="">Tất cả trạng thái</option><option value="screening">Chờ kiểm tra</option><option value="waiting">Chờ chuẩn bị</option><option value="assigned">Đang nâng cấp</option><option value="ready">Chờ tiếp tục</option><option value="verifying">Đang xác minh</option><option value="success">Hoàn tất</option><option value="failed">Thất bại</option><option value="stopped">Đã dừng</option></select></div><div class="scroll"><table><thead><tr><th>Tài khoản</th><th>Cấp đã xác minh</th><th>Mục tiêu</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="prev" onclick="page--;loadAccounts()">Trước</button><span id="paging"></span><button id="next" onclick="page++;loadAccounts()">Sau</button></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={screening:'Chờ kiểm tra',waiting:'Chờ chuẩn bị',assigned:'Đang nâng cấp',ready:'Chờ tiếp tục',verifying:'Đang xác minh',success:'Hoàn tất',failed:'Thất bại',stopped:'Đã dừng',open:'Đang xử lý',done:'Đã kết thúc'};
let selected='',page=1,busy=false,detailSeq=0,searchTimer;
async function api(action,body={}){const r=await fetch('/api/user/uplv/'+action,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(r.status===401){location.href='/auth/login';throw Error('Vui lòng đăng nhập');}if(!r.ok||!d.ok)throw Error(d.error||'Không thể xử lý');return d;}
async function refresh(){if(busy)return;busy=true;try{const d=await api('jobs');$('user').textContent=d.user.name||'Tài khoản SP1S';$('limits').textContent=`Tối đa ${d.limits.max_accounts_per_job} acc/đơn · ${d.limits.max_jobs_per_user} đơn đang mở/người.`;$('jobs').innerHTML=d.jobs.map(j=>{const c=j.task_counts,total=Object.values(c).reduce((a,b)=>a+b,0),done=c.success||0,pct=total?done/total*100:0;return `<article class="job"><div class="toolbar"><b>Đơn ${esc(j.id.slice(0,8))} · Lv${j.target}</b><span class="badge">${esc(labels[j.status]||j.status)}</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="stats"><span><b>${total}</b> tổng acc</span><span><b>${done}</b> đạt mục tiêu</span><span><b>${c.failed||0}</b> thất bại</span><span><b>${c.stopped||0}</b> đã dừng</span></div><p class="muted">${pct.toFixed(1)}% đạt mục tiêu · ${new Date(j.created_at*1000).toLocaleString()}</p><div class="toolbar"><button data-detail="${j.id}">Xem tài khoản</button><button data-export="${j.id}">Tải kết quả</button>${j.status==='open'?`<button data-stop="${j.id}">Dừng đơn</button>`:''}</div></article>`}).join('')||'<p class="muted">Bạn chưa có đơn UpLv.</p>';$('updated').textContent='Cập nhật '+new Date().toLocaleTimeString();$('error').textContent='';if($('details').open)loadAccounts();}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
async function createJob(){$('create').disabled=true;try{await api('create',{accounts:$('input').value,target:Number($('target').value),mode:$('mode').value});$('input').value='';await refresh();}catch(e){$('error').textContent=e.message;}finally{$('create').disabled=false;}}
function searchAccounts(){clearTimeout(searchTimer);detailSeq++;page=1;searchTimer=setTimeout(loadAccounts,300);}
async function loadAccounts(){const seq=++detailSeq;try{const d=await api('accounts',{job_id:selected,page,page_size:50,search:$('search').value,status:$('status').value});if(seq!==detailSeq)return;page=d.page;$('rows').innerHTML=d.accounts.map(a=>`<tr><td>${esc(a.username)}</td><td>${a.level?'Lv'+a.level:'Chưa xác minh'}</td><td>Lv${a.target}</td><td>${esc(labels[a.status]||a.status)}</td></tr>`).join('')||'<tr><td colspan="4">Không có kết quả.</td></tr>';$('paging').textContent=`Trang ${page}/${Math.max(1,Math.ceil(d.total/d.page_size))} · ${d.total} acc`;$('prev').disabled=page<=1;$('next').disabled=page*d.page_size>=d.total;}catch(e){$('error').textContent=e.message;}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.detail){selected=b.dataset.detail;page=1;$('jobLabel').textContent=selected.slice(0,8);$('search').value='';$('status').value='';$('details').showModal();loadAccounts();}else if(b.dataset.stop){if(!confirm('Dừng đơn này?'))return;try{await api('stop',{job_id:b.dataset.stop});refresh();}catch(e){$('error').textContent=e.message;}}else if(b.dataset.export){try{const d=await api('export',{job_id:b.dataset.export});for(const k of ['success','failed','pending']){const url=URL.createObjectURL(new Blob([d[k]],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`uplv_${k}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}}catch(e){$('error').textContent=e.message;}}});refresh();setInterval(()=>{if(!document.hidden)refresh();},5000);
</script></body></html>
